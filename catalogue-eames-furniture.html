<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnificent Furnitures - Eames Furniture Catalogue 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .product-card {
                page-break-inside: avoid;
            }
        }

        .catalogue {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
        }

        .cover {
            background: white;
            text-align: center;
            padding: 80px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .logo-container img {
            max-width: 80px;
            height: auto;
        }

        .logo-container h1 {
            font-size: 42px;
            color: #1a472a;
            margin: 0;
        }

        .logo-container h2 {
            font-size: 24px;
            color: #555;
            font-weight: normal;
            margin: 0;
        }

        .cover .tagline {
            font-size: 20px;
            color: #333;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #1a472a;
            display: inline-block;
        }

        .cover .year {
            margin-top: 50px;
            font-size: 18px;
            color: #666;
        }

        .cover .contact {
            margin-top: 60px;
            font-size: 16px;
            line-height: 1.8;
            color: #444;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        .content {
            padding: 40px;
        }

        .category-header {
            background: #1a472a;
            color: white;
            padding: 15px 25px;
            margin: 0 0 25px 0;
            border-radius: 8px;
        }

        .category-header h2 {
            font-size: 28px;
            margin: 0;
        }

        .category-header p {
            margin: 5px 0 0 0;
            opacity: 0.8;
            font-size: 14px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #fafafa;
        }

        .product-info {
            padding: 12px;
        }

        .product-name {
            font-size: 15px;
            font-weight: bold;
            color: #1a472a;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #c0392b;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 11px;
            color: #777;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="catalogue">
        <div class="cover">
            <div class="logo-container">
                <img src="assets/images/logo/logo.png" alt="Magnificent Furnitures Logo">

                    <h2>Limited</h2>
                </div>
            </div>
            <div class="tagline">Quality Furniture That Transforms Your Space</div>
            <div class="year">Eames Furniture Catalogue 2026</div>
            <div class="contact">
                📞 0726 100242 &nbsp;&nbsp;|&nbsp;&nbsp;
                📧 info@magnificentfurnitures.co.ke &nbsp;&nbsp;|&nbsp;&nbsp;
                📍 Nairobi, Kenya

        </div>

        <div class="content">
            <div class="category-header">

                <p>Iconic Eames style chairs, tables, and sets for modern spaces | 37 Models</p>

            <div class="product-grid" id="eames-furniture"></div>

        function renderProducts(containerId, products) {
            const container = document.getElementById(containerId);
            if (!container) return;
            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img class="product-image" src="${basePath}${p.img}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23f5f5f5%22/%3E%3Ctext x=%22100%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%23999%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">KES ${p.price}</div>
                            <div class="product-desc">${p.desc}</div>
                        </div>
                    </div>
                `;
            });
        }

        renderProducts("eames-furniture", eamesProducts);
    </script>
</body>
</html>
